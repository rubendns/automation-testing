name: CI Automation Testing

on:
  push:
    branches:
      - main
      - feature/clase15-CI-CD

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar instalación
        run: |
          python --version
          python -m pytest --version
          python -m behave --version

      - name: Ejecutar pruebas API
        run: |
          mkdir -p reports
          python -m pytest Clase12/tests_api/ -v --html=reports/pytest_report.html --self-contained-html

      - name: Ejecutar suite completa BDD
        run: |
          python -m behave Clase14/features/ -f json -o reports/behave.json -f pretty

      - name: Ejecutar prueba UI con logging
        run: |
          python -m pytest Clase13/tests_ui/test_captura_fallo.py -v

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-clase15
          path: |
            reports/pytest_report.html
            reports/behave.json
            logs/*.log
          retention-days: 90
          if-no-files-found: warn