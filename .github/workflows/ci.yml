name: CI Automation Testing

on:
  push:
    branches:
      - main
      - feature/clase15-CI-CD

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar instalación
        run: |
          python --version
          python -m pytest --version
          python -m behave --version

      - name: Ejecutar pruebas API
        run: |
          python -m pytest Clase12/tests_api/ -v

      - name: Ejecutar pruebas BDD de interfaz
        run: |
          python -m behave Clase14/features/login.feature Clase14/features/cart.feature --no-capture